name: Public website acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - run: npm test
        if: github.event_name == 'push'
        env:
          CA_SITE_URL: https://photographicode.github.io/Congregation-Assistant_Public/
          CA_SITE_OUTPUT: artifacts/published
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-website-results
          path: artifacts/
          retention-days: 14
