name: Publish canonical redirect
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-redirect-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify redirect-only repository
        run: |
          test "$(git ls-files | grep -v '^.github/workflows/pages.yml$' | sort | tr '\n' ' ')" = "404.html index.html "
          cmp index.html 404.html
          grep -q 'photographicode.github.io/congregation-assistant' index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify live redirect
        run: |
          for attempt in {1..10}; do
            page="$(curl --fail --silent --show-error 'https://photographicode.github.io/Congregation-Assistant_Public/app/?probe=1')"
            if grep -q 'photographicode.github.io/congregation-assistant' <<<"$page"; then
              exit 0
            fi
            sleep 6
          done
          exit 1
