<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Congregation Assistant has moved</title>
  <script>
    (() => {
      const legacy = "/Congregation-Assistant_Public";
      const suffix = location.pathname.startsWith(legacy)
        ? location.pathname.slice(legacy.length)
        : location.pathname;
      location.replace(
        "https://photographicode.github.io/congregation-assistant" +
          (suffix || "/") +
          location.search +
          location.hash
      );
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://photographicode.github.io/congregation-assistant/">
  </noscript>
</head>
<body>
  <p>Congregation Assistant has moved to <a href="https://photographicode.github.io/congregation-assistant/">the canonical application</a>.</p>
</body>
</html>
